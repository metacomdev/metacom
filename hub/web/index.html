<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#282c34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="metacom">
<title>metacom</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<!--
  The terminal chat (cli/src/chat), drawn in a browser: the same font, the same colours (termcn's
  default theme on a One Dark terminal), the same lines — a coloured name and the time over the
  text, ↩ reply ↪ forward under it, the members on the line above a rounded input with a ❯, the
  hint under it, the room list in place of the conversation. Only what a terminal cannot do is
  added: a rooms button under the input on a phone.
-->
<style>
  /* JetBrains Mono, Ghostty's own font, served from the hub (fonts/, OFL): a phone has no copy,
     and it is what the terminal chat is read in. Latin and Cyrillic, regular and bold, italic. */
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "JetBrains Mono"; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/jetbrains-mono-latin-400-italic.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "JetBrains Mono"; font-style: italic; font-weight: 700; font-display: swap; src: url(fonts/jetbrains-mono-latin-700-italic.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/jetbrains-mono-cyrillic-400-normal.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/jetbrains-mono-cyrillic-700-normal.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  :root {
    --bg: #282c34;
    --fg: #ffffff;
    --muted: #9ca3af;
    --border: #4b5563;
    --primary: #7c3aed;
    --accent: #8b5cf6;
    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
    --info: #3b82f6;
    --mono: "JetBrains Mono", "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "DejaVu Sans Mono", ui-monospace, monospace;
    --gutter: 2ch;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 var(--mono); font-variant-ligatures: none;
    /* light on dark, smoothed in grey as Ghostty and iOS do: Chrome and Firefox on a Mac draw
       it heavier and rougher unless asked */
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
    position: fixed; top: 0; left: 0; width: 100%; height: var(--vh, 100dvh);
    transform: translateY(var(--vv-top, 0px));
    display: flex; flex-direction: column; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* a phone: one smaller size for everything, the input included (maximum-scale=1 keeps iOS
     from zooming in on a field under 16px) */
  @media (max-width: 640px) { body { font-size: 12px; --gutter: 1ch; } }
  body.keyboard { padding-bottom: 0; }
  ::selection { background: var(--primary); color: #fff; }
  button, textarea, input { font: inherit; color: inherit; background: none; border: 0; outline: 0; margin: 0; padding: 0; }
  button { cursor: pointer; text-align: left; }
  .muted { color: var(--muted); }
  .b { font-weight: 700; }
  .primary { color: var(--primary); }
  .accent { color: var(--accent); }
  .success { color: var(--success); }
  .warning { color: var(--warning); }
  .error { color: var(--error); }

  /* the conversation, bottom-pinned like the terminal's scrollback */
  #app { display: contents; }
  #feed { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 1ch 0 var(--gutter); display: flex; flex-direction: column; }
  #feed > .spacer { flex: 1; }
  .entry { white-space: pre-wrap; word-break: break-word; }
  .entry.message, .entry.note-keep { margin-bottom: 1.45em; }
  .entry.system + .entry.system { margin-top: 0; }
  .entry.system { margin-bottom: 0; }
  .entry.system:last-child, .entry.system:has(+ .entry:not(.system)) { margin-bottom: 1.45em; }
  .head .name, .name { font-weight: 700; }
  .head .arrow { margin: 0 1ch; }
  .actions { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions button { color: var(--muted); margin-right: 2ch; }
  .actions button:hover { color: var(--fg); }
  .more-items button { color: var(--muted); margin-right: 2ch; }
  .more-items button:hover, .actions button.more[aria-expanded="true"] { color: var(--fg); }
  .pinmark { color: var(--warning); margin-left: 2ch; }
  .entry.editing { box-shadow: -1ch 0 0 -0.6ch var(--warning); }
  .pinmark.first { margin: 0 1ch 0 0; }
  /* between the older messages fetched alone (at the top) and the loaded ones: history skipped */
  .entry.gap { margin: 0.2em 0 0.725em var(--gutter); letter-spacing: 0.2em; }
  .loadmore { padding: 0.35em 0 0.9em; }
  .loadmore button { font: inherit; color: #ffffff; background: #333842; border: 1px solid var(--border); border-radius: 0; padding: 0.25em 1.4em; cursor: pointer; }
  .loadmore .muted { background: var(--bg); padding: 0.25em 1em; }
  .actions button.answering { color: var(--warning); }
  .entry.flash { background: color-mix(in srgb, var(--warning) 14%, transparent); transition: background 0.4s; }
  .pins { flex: none; max-height: 45vh; overflow-y: auto; padding: 4px 1ch 2px var(--gutter); border-top: 1px solid color-mix(in srgb, var(--muted) 35%, transparent); }
  .pin + .pin { margin-top: 6px; }
  .pintext { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* one tap on a phone: no hover look there (iOS spends the first tap on :hover) */
  .pintext { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  @media (hover: hover) { .pintext:hover { background: color-mix(in srgb, var(--muted) 10%, transparent); } }
  .pintext .pinmark { margin-left: 0; }
  .pinsmore { color: var(--warning); margin-bottom: 4px; }
  .edited { color: var(--muted); margin-left: 2ch; }
  /* tables: hairlines, no zebra; wider than the message: it scrolls, not the page */
  .table-wrap { overflow-x: auto; max-width: 100%; margin: 0.3em 0 0.5em; }
  table.md { border-collapse: collapse; font: inherit; }
  table.md th, table.md td { border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); padding: 0.15em 1ch; vertical-align: top; text-align: left; overflow-wrap: normal; word-break: normal; white-space: normal; min-width: 6ch; }
  /* a text column is never squeezed below a readable width: the table scrolls instead */
  table.md td:not(.num) { min-width: 14ch; }
  table.md td.blank, table.md tr.band td { min-width: 0; }
  table.md th { font-weight: 700; color: var(--fg); background: color-mix(in srgb, var(--muted) 12%, transparent); white-space: nowrap; }
  table.md td.num, table.md th.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.md td.neg { background: var(--fg); color: var(--bg); font-weight: 700; }
  table.md tr.band td { background: var(--fg); color: var(--bg); font-weight: 700; }
  .task-box { color: var(--muted); }
  #text { cursor: text; }
  .task-done { color: var(--muted); text-decoration: line-through; }
  #marks .ghost { color: var(--muted); opacity: 0.75; }
  #marks .ghost-key { color: var(--muted); opacity: 0.45; }
  /* on the row under the input, right of "← rooms" (and before "✕ cancel reply") */
  .waiting { flex: 0 0 auto; margin-left: auto; padding: 0; color: var(--warning); white-space: nowrap; }
  .waiting + #cancelReply, .waiting + #unarchive { margin-left: 2ch; }
  .waiting button { padding: 0; color: inherit; }
  @media (pointer: coarse) {
    .waiting { display: flex; align-items: center; margin-block: calc((1.45em - 44px) / 2); }
    .waiting .count, .waiting .stepbtn { min-height: 44px; }
    .waiting .stepbtn { min-width: 44px; font-size: 1.3em; display: inline-flex; align-items: center; justify-content: center; }
    .waiting .stepbtn:first-child { margin-left: -12px; }
    .waiting .stepbtn:last-child { margin-right: -12px; }
    #hint:empty { display: none; }
    .waiting + #cancelReply, .waiting + #unarchive { margin-left: 1ch; }
  }
  /* the narrowest phones: "‹ 1/3 ›" */
  @media (pointer: coarse) and (max-width: 360px) {
    .waiting .count .w { display: none; }
  }
  .versions { border-left: 1px solid var(--muted); margin: 4px 0 4px 1ch; padding-left: 2ch; }
  .version + .version { margin-top: 6px; }
  .vtext { white-space: pre-wrap; opacity: 0.85; }
  .body .code { color: var(--accent); }
  .body .quote, .body .bullet, .body .rule { color: var(--muted); }
  .body .line { min-height: 1.45em; }
  .body .hang { display: block; padding-left: var(--hang, 0); text-indent: calc(-1 * var(--hang, 0)); }
  .body a.link, .body button.link { color: var(--info); text-decoration: underline; text-underline-offset: 2px; }
  .body button.mention { font-weight: 700; }
  .banner { padding: 1.45em 1ch 1.45em 1ch; }
  .rule-now { padding-left: 2ch; color: var(--muted); margin-bottom: 0; }
  .block { padding-left: 2ch; margin-bottom: 1.45em; white-space: pre; overflow-x: auto; flex-shrink: 0; }
  .video { display: block; max-width: min(100%, 560px); max-height: 50vh; margin: 4px 0; background: #000; border-radius: 2px; }
  /* a picture in the message itself; a tap opens it full size */
  .picture { display: block; width: fit-content; margin: 4px 0; }
  .picture img { display: block; max-width: min(100%, 560px); max-height: 50vh; border-radius: 2px; background: #000; }
  .actions a.file { color: var(--info); margin-right: 2ch; text-decoration: none; }
  .screen { border-left: 1px solid var(--border); padding-left: 1ch; color: var(--muted); }

  /* the room list, in the conversation's place: the page renders one or the other, so no class
     hides either (a class set after paint hid the feed while it was scrolled to its end) */
  #rooms { flex: 1; min-height: 0; overflow-y: auto; padding: 0 1ch 0 var(--gutter); display: flex; flex-direction: column; justify-content: flex-end; }
  #rooms .title { color: var(--muted); margin-bottom: 1.45em; }
  #rooms .title .back { font: inherit; color: var(--primary); background: none; border: 0; padding: 0.6em 0.8em 0.6em 0; margin: -0.6em 0; cursor: pointer; }
  #rooms .row { display: block; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rooms .row .room { display: inline-block; min-width: var(--nameW, 10ch); }
  #rooms .row.active .room { color: var(--primary); font-weight: 700; }
  #rooms .row .mark { color: var(--primary); display: inline-block; width: 2ch; }
  /* /loops shows in the room list's place, in its look: inside a loop, its prompt under the title */
  #rooms .title .loop-prompt { color: var(--fg); white-space: pre-wrap; margin: 0.3em 0 0.1em; }
  #rooms .row .room.warning { color: var(--warning); }

  /* the line above the input */
  /* Spacing is the terminal's grid: a row is 1.45em, a column 1ch. The live area sits in the
     chat's gutter; the status line pads one column more, the hint two; the box's border rows are
     half a row of air above and below the text inside it and around it. */
  #status { display: flex; justify-content: space-between; gap: 2ch; padding: 0 1ch 0 calc(var(--gutter) + 1ch); white-space: nowrap; }
  #status .who { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #status .who button { margin-right: 3ch; }
  #status .me { flex: 0 0 auto; color: var(--muted); }
  #status .me .room { color: var(--fg); font-weight: 700; }

  /* the list over the input for @ and / */
  #popup { padding-left: calc(var(--gutter) + 2ch); display: none; }
  #popup.open { display: block; }
  #popup .item { display: block; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #popup .item .mark { color: var(--primary); display: inline-block; width: 2ch; }
  #popup .item.active .label { font-weight: 700; }
  #popup .hint { color: var(--muted); }

  /* the input: a rounded box, ❯ in the primary colour */
  #composer { margin: 0.725em 1ch 0.725em var(--gutter); border: 1px solid var(--border); border-radius: 4px; padding: 0.725em 1ch; display: flex; align-items: flex-start; }
  #composer:focus-within { border-color: #6b7280; }
  #composer .prompt { color: var(--primary); font-weight: 700; flex: 0 0 2ch; line-height: 1.45; }
  #text { flex: 1; resize: none; min-height: 1.45em; max-height: calc(6 * 1.45em); line-height: 1.45; overflow-y: auto; caret-color: var(--fg); }
  #text::placeholder { color: var(--muted); opacity: 1; }
  /* the terminal's cursor: a white block over the character, inverting it, blinking; the
     browser's thin caret is hidden. Solid while typing, blinking once it rests. */
  #composer { position: relative; }
  #text { caret-color: transparent; }
  #cursor { position: absolute; width: 1ch; height: 1.45em; background: #fff; mix-blend-mode: difference; pointer-events: none; display: none; }
  #cursor.on { display: block; }
  #cursor.rest { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #marks { position: absolute; display: none; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; line-height: 1.45; overflow: hidden; pointer-events: none; color: var(--fg); }
  #composer.marks-on #marks { display: block; }
  #composer.marks-on #text { color: transparent; }
  #text { position: relative; z-index: 1; background: transparent; }
  /* the invisible fields ^ and ⌄ over a phone's keyboard land on, where the input is (no scroll, no zoom) */
  #composer .step { position: absolute; left: 3ch; top: 0.725em; width: 2px; height: 2px; padding: 0; border: 0; margin: 0; opacity: 0.01; font-size: 16px; pointer-events: none; caret-color: transparent; background: transparent; color: transparent; }
  #cursor { z-index: 2; }
  #mirror { position: absolute; visibility: hidden; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; line-height: 1.45; top: 0; left: 0; }

  /* the hint under it, and on a phone the rooms button */
  /* live mode (app.js LiveScreen, LiveBar) */
  #live { flex: 1; min-height: 0; overflow: hidden; padding: 0 1ch 0 var(--gutter); position: relative; display: flex; flex-direction: column; justify-content: flex-end; cursor: text; }
  #live pre { margin: 0; font-family: var(--mono); line-height: 1.2; white-space: pre; overflow-x: auto; overflow-y: hidden; }
  @media (max-width: 640px) { #livebar .hint { display: none; } #livebar .keys { margin-left: 0; } }
  #live .row { min-height: 1.2em; }
  #live { touch-action: pan-x; }
  #live .back { position: absolute; right: 1.5ch; bottom: 0.6em; font: inherit; color: var(--bg); background: var(--warning); border: 0; border-radius: 999px; padding: 0.35em 1.1em; cursor: pointer; }
  #liveType { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; }
  #livebar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5em 2ch; padding: 0.4em 1ch 0.6em var(--gutter); border-top: 1px solid var(--border); white-space: nowrap; }
  #livebar .leave { color: var(--warning); font-weight: 700; }
  #livebar .success { color: var(--success); }
  #livebar .keys { display: inline-flex; gap: 1ch; margin-left: auto; }
  #livebar .livekey { border: 1px solid var(--border); border-radius: 3px; padding: 0 0.8ch; color: var(--fg); }
  #footer { display: flex; align-items: center; gap: 2ch; padding: 0 1ch 0 calc(var(--gutter) + 2ch); min-height: 1.45em; margin-bottom: 0.725em; }
  #hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  #roomsBtn { display: none; flex: 0 0 auto; color: var(--muted); padding: 0; }
  #roomsBtn:active { color: var(--fg); }
  @media (max-width: 820px), (pointer: coarse) { #roomsBtn { display: inline-block; } }
  .slot { display: contents; }
  #attachBtn { flex: 0 0 auto; margin-left: auto; padding: 0; color: var(--muted); white-space: nowrap; }
  #attachBtn:active { color: var(--fg); }
  #attachBtn .clip { display: block; }
  @media (hover: hover) { #attachBtn:hover { color: var(--fg); } }
  @media (pointer: coarse) { #attachBtn { min-height: 44px; min-width: 44px; padding: 0 1ch; margin-block: calc((1.45em - 44px) / 2); margin-right: -1ch; } }
  #unarchive { flex: 0 0 auto; margin-left: auto; padding: 0; color: var(--warning); white-space: nowrap; }
  @media (pointer: coarse) { #unarchive { min-height: 44px; padding: 0 1ch; margin-block: calc((1.45em - 44px) / 2); margin-right: -1ch; } }
  #cancelReply { flex: 0 0 auto; margin-left: auto; padding: 0; color: var(--warning); white-space: nowrap; }
  #cancelReply:active { color: var(--fg); }
  /* a finger's target (44px), without making the row taller */
  @media (pointer: coarse) { #cancelReply { min-height: 44px; min-width: 44px; padding: 0 1ch; margin-block: calc((1.45em - 44px) / 2); margin-right: -1ch; } }

  /* sign in */
  #login { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; padding: 0 3ch; gap: 0.8em; z-index: 10; }
  #login.hidden { display: none; }
  /* an invite: from the top, not centred, so the name, join and the first step fit the first screen */
  #login.invite { justify-content: flex-start; padding-top: max(4vh, env(safe-area-inset-top)); overflow-y: auto; }
  #login .steps { margin-top: 1.2em; display: flex; flex-direction: column; gap: 0.6em; }
  .entry.request { border-left: 2px solid var(--accent); padding-left: 1ch; margin: 0.4em 0; }
  .entry.request .actions button { margin-right: 1.5ch; }
  .entry.request .approve { color: var(--success, #4caf50); }
  #login details.api summary { cursor: pointer; margin-top: 1em; }
  #login .step .cmd { display: flex; gap: 1ch; align-items: center; border: 1px solid var(--border); border-radius: 0.4em; padding: 0.3em 1ch; }
  /* a command breaks only at its spaces; a word longer than the line (a link) scrolls sideways */
  #login .step code { white-space: pre-wrap; word-break: normal; overflow-wrap: normal; overflow-x: auto; min-width: 0; flex: 1; padding: 0.2em 0; }
  .copylink { color: var(--success); padding: 0; flex: 0 0 auto; }
  @media (pointer: coarse) { .copylink { min-height: 44px; padding: 0 1ch; } }
  .tokenlink { word-break: break-all; color: var(--fg); }
  #login .field { display: flex; border: 1px solid var(--border); border-radius: 0.6em; padding: 0.3em 1ch; }
  #login .field .prompt { color: var(--primary); font-weight: 700; width: 2ch; }
  #login .field input { flex: 1; }
  #login input::placeholder { color: var(--muted); }
  #login .go { color: var(--primary); font-weight: 700; align-self: flex-start; }
  #loginError { color: var(--error); min-height: 1.45em; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/vendor/htm-preact.umd.js"></script>
<script src="/app.js"></script>
</body>
</html>
